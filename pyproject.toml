[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "general-slurm"
version = "0.1.0"
description = "Helpers for Slurm job scripts: declared arguments, log frame, virtualenv, self-requeueing arrays, packing, and the Python side of the contract."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Maksymilian Kliczkowski" },
]
keywords = ["slurm", "hpc", "cluster", "job", "array", "requeue"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
